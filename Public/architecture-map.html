<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Snusdex — Architecture Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#e2e2e2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* ── Toolbar ──────────────────────────────────────────────── */
#toolbar{background:#000;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;display:flex;flex-direction:column;gap:0}
#toolbar-top{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;min-height:48px}
#toolbar h1{font-size:15px;font-weight:600;color:#fff;letter-spacing:-.2px;white-space:nowrap;flex:1}
#toolbar-chips{display:flex;align-items:center;gap:6px;padding:0 14px 10px;flex-wrap:wrap}
.filter-label{font-size:12px;color:rgba(255,255,255,.3);white-space:nowrap;flex-shrink:0}
.chip{padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:#1C1C1E;font-size:13px;cursor:pointer;color:rgba(255,255,255,.55);transition:all .15s;white-space:nowrap;user-select:none;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.chip:hover{border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.85)}
.chip:active{opacity:.65}
.chip.active{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.28);color:#fff}
.chip.bug-chip{border-color:rgba(255,59,48,.3);color:#ff6b6b}
.chip.bug-chip.active{background:rgba(255,59,48,.12);border-color:rgba(255,59,48,.45);color:#ffb3ae}
#zoom-btns{display:flex;gap:6px;flex-shrink:0}
.zbtn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:#1C1C1E;color:rgba(255,255,255,.7);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.zbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.zbtn:active{opacity:.6}

/* ── Main layout ──────────────────────────────────────────── */
#main{display:flex;flex:1;overflow:hidden;position:relative;min-height:0}
#canvas-wrap{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
#canvas-wrap.grabbing{cursor:grabbing}
svg#map{position:absolute;top:0;left:0;touch-action:none}

/* ── Backdrop ─────────────────────────────────────────────── */
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;-webkit-tap-highlight-color:transparent}
#backdrop.visible{display:block}

/* ── Sidebar — desktop (right panel) ─────────────────────── */
#sidebar{width:0;background:#0d0d0d;border-left:1px solid rgba(255,255,255,.08);overflow:hidden;transition:width .25s cubic-bezier(.4,0,.2,1);flex-shrink:0;display:flex;flex-direction:column;position:relative;z-index:100}
#sidebar.open{width:320px}
#sidebar-handle{display:none}
#sidebar-inner{width:320px;padding:16px;overflow-y:auto;height:100%;-webkit-overflow-scrolling:touch}
#sidebar-inner h2{font-size:17px;font-weight:700;color:#fff;margin-bottom:14px;padding-right:40px;letter-spacing:-.3px}
.sidebar-section{margin-bottom:18px}
.sidebar-section h3{font-size:11px;font-weight:600;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.detail-row{display:flex;gap:8px;margin-bottom:6px;font-size:13px}
.detail-label{color:rgba(255,255,255,.35);width:70px;flex-shrink:0}
.detail-val{color:rgba(255,255,255,.75);word-break:break-all}
.edge-list{display:flex;flex-direction:column;gap:5px}
.edge-item{font-size:13px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:7px}
.edge-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bug-card{background:rgba(255,59,48,.07);border:1px solid rgba(255,59,48,.22);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.bug-card .bug-title{font-size:13px;color:#ff9f9f;font-weight:600;margin-bottom:4px}
.bug-card .bug-ref{font-size:12px;color:#ff6b6b;font-family:Menlo,monospace}
.bug-card .bug-sev{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.sev-med{background:rgba(255,149,0,.15);color:#FF9500;border:1px solid rgba(255,149,0,.25)}
.sev-low{background:rgba(48,209,88,.12);color:#30D158;border:1px solid rgba(48,209,88,.22)}
.finding-item{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:12px;padding-left:12px;border-left:2px solid rgba(255,255,255,.12);line-height:1.55}
.finding-item strong{color:rgba(255,255,255,.85)}
.finding-item.good{border-left-color:rgba(48,209,88,.4)}
#close-sidebar{position:absolute;top:12px;right:12px;width:32px;height:32px;background:#1C1C1E;border:1px solid rgba(255,255,255,.12);border-radius:50%;color:rgba(255,255,255,.6);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;-webkit-tap-highlight-color:transparent;transition:all .15s}
#close-sidebar:hover,#close-sidebar:active{background:rgba(255,255,255,.1);color:#fff}

/* ── SVG ──────────────────────────────────────────────────── */
.cluster-label{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.45}
.node rect{transition:filter .15s}
.node:hover rect{filter:brightness(1.3)}
.node.selected rect{filter:brightness(1.5)}
.node-title{font-size:10px;font-weight:700;fill:#fff;pointer-events:none}
.node-sub{font-size:9px;fill:rgba(255,255,255,.5);pointer-events:none}
.bug-badge{font-size:9px;font-weight:700;fill:#ff9f9f;pointer-events:none}
.new-badge{font-size:7px;font-weight:800;fill:#34d399;pointer-events:none;letter-spacing:.4px}
.edge-path{fill:none;stroke-width:1.5;opacity:.65}
.edge-path.highlighted{opacity:1;stroke-width:2.5}
.edge-path.dimmed{opacity:.1}
.edge-label{font-size:8px;font-weight:600;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .15s}
.edge-label.visible{opacity:1}
.node{cursor:pointer}
.node.dimmed rect{opacity:.18}
.node.dimmed text{opacity:.18}

/* ── Mobile overrides ─────────────────────────────────────── */
@media (max-width:768px){
  body{height:100dvh}

  #sidebar{
    position:fixed;
    bottom:0;left:0;right:0;
    width:100%!important;
    height:0;
    max-height:72vh;
    border-left:none;
    border-top:1px solid rgba(255,255,255,.1);
    border-radius:20px 20px 0 0;
    transition:height .3s cubic-bezier(.4,0,.2,1);
    flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  #sidebar.open{height:72vh}

  #sidebar-handle{
    display:flex;
    justify-content:center;
    align-items:center;
    height:28px;
    flex-shrink:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #sidebar-handle::after{
    content:'';
    display:block;
    width:36px;height:4px;
    background:rgba(255,255,255,.2);
    border-radius:2px;
  }

  #sidebar-inner{
    width:100%;
    padding:8px 16px 16px;
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    min-height:0;
  }

  #close-sidebar{top:8px;right:14px}

  #sidebar-inner h2{font-size:17px;padding-right:44px}
  .detail-row{font-size:14px}
  .edge-item{font-size:14px}
  .finding-item{font-size:14px}
  .bug-card .bug-title{font-size:14px}
  .node{cursor:pointer}
}
</style>
</head>
<body>

  </div>
</div>

// ─── SVG SETUP ─────────────────────────────────────────────────────────────

const SVG_W = 1900;
const SVG_H = 860;
const INIT_SCALE_MOBILE = 0.24;

const svg = document.getElementById('map');
const wrap = document.getElementById('canvas-wrap');
svg.setAttribute('width',  SVG_W);
svg.setAttribute('height', SVG_H);
svg.style.overflow = 'visible';

let tx = 0, ty = 0, scale = 1;
let dragging = false, dragStartX = 0, dragStartY = 0, txStart = 0, tyStart = 0;

const g = document.createElementNS('http://www.w3.org/2000/svg','g');
g.id = 'world';
g.style.transformOrigin = '0 0';
g.style.willChange = 'transform';
svg.appendChild(g);

function isMobile() { return window.innerWidth <= 768; }

function haptic(type) {
  try { window.webkit?.messageHandlers?.hapticHandler?.postMessage(type); } catch(_) {}
}

// ── Cached viewport + wrapper rect ─────────────────────────────────────────
let _vpW = 0, _vpH = 0, _wrapRect = null;
function _cacheVp() {
  _vpW = wrap.clientWidth;
  _vpH = wrap.clientHeight;
  _wrapRect = null;
}
_cacheVp();
function _getWrapRect() {
  if (!_wrapRect) _wrapRect = wrap.getBoundingClientRect();
  return _wrapRect;
}

// ── rAF-batched CSS transform ───────────────────────────────────────────────
let _rafId = null;
function setTransform() {
  if (_rafId) return;
  _rafId = requestAnimationFrame(() => {
    _rafId = null;
    g.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  });
}

function _applyNow() {
  if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
  g.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}

function resetView() {
  const ch = _vpH || wrap.clientHeight;
  const SVG_Y_SPAN   = 740;  // y=60 (entry top) → y=800 (friends bottom)
  const SVG_Y_CENTER = 430;
  scale = Math.min((ch * 0.80) / SVG_Y_SPAN, 2);
  tx = isMobile() ? 14 : 24;
  ty = ch / 2 - SVG_Y_CENTER * scale;
  _applyNow();
}

// ─── DRAW EDGES ────────────────────────────────────────────────────────────

const edgeLayer = document.createElementNS('http://www.w3.org/2000/svg','g');
edgeLayer.id = 'edges';
g.appendChild(edgeLayer);

const edgeEls = [];

edges.forEach(e => {
  const fn = nodes.find(x => x.id === e.from);
  const tn = nodes.find(x => x.id === e.to);
  if (!fn || !tn) return;

  const dx = (tn.x) - (fn.x + fn.w);
  const dy = (tn.y + tn.h/2) - (fn.y + fn.h/2);
  let x1,y1,x2,y2,cx1,cy1,cx2,cy2;

  if (Math.abs(dx) > Math.abs(dy) * 0.5) {
    x1 = fn.x + fn.w; y1 = fn.y + fn.h/2;
    x2 = tn.x;        y2 = tn.y + tn.h/2;
    const cx = (x2 - x1) * 0.5;
    cx1 = x1 + cx; cy1 = y1;
    cx2 = x2 - cx; cy2 = y2;
  } else {
    if (dy > 0) {
      x1 = fn.x + fn.w/2; y1 = fn.y + fn.h;
      x2 = tn.x + tn.w/2; y2 = tn.y;
    } else {
      x1 = fn.x + fn.w/2; y1 = fn.y;
      x2 = tn.x + tn.w/2; y2 = tn.y + tn.h;
    }
    const cy = (y2 - y1) * 0.5;
    cx1 = x1; cy1 = y1 + cy;
    cx2 = x2; cy2 = y2 - cy;
  }

  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', `M${x1},${y1} C${cx1},${cy1} ${cx2},${cy2} ${x2},${y2}`);
  path.setAttribute('class', 'edge-path');
  path.setAttribute('stroke', EDGE_COLORS[e.type] || '#555');
  path.setAttribute('marker-end', `url(#arrow-${e.type})`);
  path.dataset.type  = e.type;
  path.dataset.from  = e.from;
  path.dataset.to    = e.to;
  path.dataset.label = e.label || '';
  edgeLayer.appendChild(path);
  edgeEls.push(path);

  path._labelData = e.label
    ? { label:e.label, mx:(x1+x2)/2, my:(y1+y2)/2-5, color:EDGE_COLORS[e.type] }
    : null;
});

const nodeLayer = document.createElementNS('http://www.w3.org/2000/svg','g');

  grp.appendChild(rect);

  const lines = n.label.split('\n');

  lines.forEach((line, li) => {

  if (n.sub) {

  if (n.bug) {
    const badge = document.createElementNS('http://www.w3.org/2000/svg','text');
    badge.setAttribute('x', n.x + n.w - 6);

// ─── SELECTION & SIDEBAR ───────────────────────────────────────────────────

let selectedNode = null;
let activeFilter = 'all';

function selectNode(id) {
  haptic('medium');
  selectedNode = id;
  const n = nodes.find(x => x.id === id);
  if (!n) return;

  const connected = new Set([id]);
  edgeEls.forEach(e => {
    if (e.dataset.from === id || e.dataset.to === id) {
      connected.add(e.dataset.from);
      connected.add(e.dataset.to);
    }
  });

  Object.entries(nodeEls).forEach(([nid, el]) => {
    el.classList.toggle('selected', nid === id);
    el.classList.toggle('dimmed', !connected.has(nid));
  });
  edgeEls.forEach(e => {
    const rel = e.dataset.from === id || e.dataset.to === id;
    e.classList.toggle('highlighted', rel);
    e.classList.toggle('dimmed', !rel);
    if (e._labelEl) e._labelEl.classList.toggle('visible', rel);
  });

  renderSidebarNode(n);
  openSidebar();
}

function clearSelection() {
  selectedNode = null;
  Object.values(nodeEls).forEach(el => el.classList.remove('selected','dimmed'));
  edgeEls.forEach(e => {
    e.classList.remove('highlighted','dimmed');
    if (e._labelEl) e._labelEl.classList.remove('visible');
  });
}

      ${n.bug ? `<div class="detail-row"><span class="detail-label">Bug ref</span><span class="detail-val" style="color:#f87171;font-family:monospace">${n.bug}</span></div>` : ''}
    </div>
    ${bugs.length ? `
    <div class="sidebar-section">
      <h3>Known Bugs</h3>
      ${bugs.map(b => `
      <div class="bug-card">
        <div class="bug-title">${b.t} <span class="bug-sev sev-${b.sev}">${b.sev}</span></div>

// ─── FILTER CHIPS ──────────────────────────────────────────────────────────

document.querySelectorAll('.chip[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    haptic('light');
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('.chip[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter();
  });
});

function applyFilter() {
  clearSelection();
  if (activeFilter === 'all') {
    edgeEls.forEach(e => e.classList.remove('dimmed'));
    Object.values(nodeEls).forEach(el => el.classList.remove('dimmed'));
    return;
  }
  if (activeFilter === 'bugs') {
    const bugIds = new Set(Object.keys(KNOWN_BUGS));
    Object.entries(nodeEls).forEach(([id, el]) => el.classList.toggle('dimmed', !bugIds.has(id)));
    edgeEls.forEach(e => e.classList.add('dimmed'));
    return;
  }
  const visibleNodes = new Set();
  edgeEls.forEach(e => {
    const show = e.dataset.type === activeFilter;
    e.classList.toggle('dimmed', !show);
    if (show) { visibleNodes.add(e.dataset.from); visibleNodes.add(e.dataset.to); }
  });
  Object.entries(nodeEls).forEach(([id, el]) => el.classList.toggle('dimmed', !visibleNodes.has(id)));
}

// ─── PAN + ZOOM (mouse) ────────────────────────────────────────────────────

wrap.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  dragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  txStart = tx; tyStart = ty;
  wrap.classList.add('grabbing');
});

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = txStart + (e.clientX - dragStartX);
  ty = tyStart + (e.clientY - dragStartY);
  setTransform();
});

window.addEventListener('mouseup', () => {
  dragging = false;
  wrap.classList.remove('grabbing');
});

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = _getWrapRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  if (e.ctrlKey) {
    const rawDelta = e.deltaY;
    const zoomFactor = 1 - Math.sign(rawDelta) * Math.min(Math.abs(rawDelta) * 0.004, 0.06);
    const newScale = Math.min(3, Math.max(0.15, scale * zoomFactor));
    tx = mx - (mx - tx) * (newScale / scale);
    ty = my - (my - ty) * (newScale / scale);
    scale = newScale;
  } else {
    tx -= e.deltaX;
    ty -= e.deltaY;
  }
  setTransform();
}, { passive: false });

// ─── PAN + PINCH (touch) ───────────────────────────────────────────────────

let touchDragStartX = 0, touchDragStartY = 0, touchTxStart = 0, touchTyStart = 0;
let lastPinchDist = null, lastPinchMx = 0, lastPinchMy = 0;
let touchMoved = false;
let touchStartX = 0, touchStartY = 0;

wrap.addEventListener('touchstart', e => {
  e.preventDefault();
  _wrapRect = wrap.getBoundingClientRect();
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchDragStartX = t.clientX; touchDragStartY = t.clientY;
    touchTxStart = tx; touchTyStart = ty;
    touchStartX = t.clientX; touchStartY = t.clientY;
    touchMoved = false;
    lastPinchDist = null;
  } else if (e.touches.length === 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    lastPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    lastPinchMx = (t0.clientX + t1.clientX) / 2 - _wrapRect.left;
    lastPinchMy = (t0.clientY + t1.clientY) / 2 - _wrapRect.top;
  }
}, { passive: false });

wrap.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && lastPinchDist === null) {
    const t = e.touches[0];
    tx = touchTxStart + (t.clientX - touchDragStartX);
    ty = touchTyStart + (t.clientY - touchDragStartY);
    const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) touchMoved = true;
    setTransform();
  } else if (e.touches.length === 2 && lastPinchDist !== null) {
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const rect = _wrapRect;
    const mx = (t0.clientX + t1.clientX) / 2 - rect.left;
    const my = (t0.clientY + t1.clientY) / 2 - rect.top;
    const zoomFactor = dist / lastPinchDist;
    const newScale = Math.min(3, Math.max(0.15, scale * zoomFactor));
    tx = mx - (mx - tx) * (newScale / scale);
    ty = my - (my - ty) * (newScale / scale);
    scale = newScale;
    lastPinchDist = dist;
    touchMoved = true;
    setTransform();
  }
}, { passive: false });

wrap.addEventListener('touchend', e => {
  if (e.touches.length < 2) lastPinchDist = null;

  if (e.changedTouches.length === 1 && !touchMoved) {
    const t = e.changedTouches[0];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el) {
      const nodeGrp = el.closest('.node');
      if (nodeGrp && nodeGrp.dataset.id) {
        selectNode(nodeGrp.dataset.id);
        return;
      }
      if (!el.closest('#sidebar') && !el.closest('#toolbar')) {
        closeSidebar();
      }
    }
  }
});

// ─── CANVAS CLICK (desktop) ────────────────────────────────────────────────

wrap.addEventListener('click', e => {
  if (!e.target.closest('.node') && !e.target.closest('#sidebar')) {
    closeSidebar();
  }
});

// ─── ZOOM BUTTONS ──────────────────────────────────────────────────────────

document.getElementById('zin').addEventListener('click', () => {
  haptic('light');
  const cw = _vpW / 2, ch = _vpH / 2;
  const newScale = Math.min(3, scale * 1.25);
  tx = cw - (cw - tx) * (newScale / scale);
  ty = ch - (ch - ty) * (newScale / scale);
  scale = newScale; _applyNow();
});
document.getElementById('zout').addEventListener('click', () => {
  haptic('light');
  const cw = _vpW / 2, ch = _vpH / 2;
  const newScale = Math.max(0.15, scale / 1.25);
  tx = cw - (cw - tx) * (newScale / scale);
  ty = ch - (ch - ty) * (newScale / scale);
  scale = newScale; _applyNow();
});
document.getElementById('zreset').addEventListener('click', () => { haptic('light'); resetView(); });
document.getElementById('zfindings').addEventListener('click', () => {
  haptic('light');
  renderSidebarDefault();
  openSidebar();
});

// ─── INIT ──────────────────────────────────────────────────────────────────

window.addEventListener('resize', () => {
  _cacheVp();
  if (isMobile()) {
    backdrop.classList.toggle('visible', sidebar.classList.contains('open'));
  } else {
    backdrop.classList.remove('visible');
  }
});

resetView();
renderSidebarDefault();
if (!isMobile()) openSidebar();
</script>
</body>
</html>
